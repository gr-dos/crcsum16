name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: open-watcom/setup-watcom@v0
        with:
          version: "2.0"

      - name: Install DOSBox-X and NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x nasm

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Build assembly version
        run: make asm

      - name: Test assembly version
        run: make test-asm
